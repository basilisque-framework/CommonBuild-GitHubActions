name: NetCommonBuild

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      basBuildType:
        description: 'The type of build that should be started. Supported values are ''Alpha'', ''CI'', ''Preview'', ''RC'' and ''Release''.'
        default: 'Preview'
        required: true
        type: string
      projectOrSolution:
        description: 'The project or solution that will be built. The default builds all solutions in the "src" directory of the repository.'
        default: 'src/*.slnx'
        required: false
        type: string
      artifactsPath:
        description: 'The path where build artifacts will be stored. The default is "src/artifacts".'
        default: 'src/artifacts'
        required: false
        type: string
      dotNetVersion:
        description: 'The version of .Net that will be used for the build.'
        default: 10.0.x
        required: false
        type: string
      publishTargetFramework:
        description: 'The target framework that will be used for publishing.'
        default: ''
        required: false
        type: string
      runDotnetTest:
        description: 'If true, runs dotnet test.'
        default: true
        required: false
        type: boolean
      runDotnetPublish:
        description: 'If true, runs dotnet publish and uploads publish artifacts.'
        default: false
        required: false
        type: boolean
      runDotnetPack:
        description: 'If true, runs dotnet pack and uploads/publishes NuGet artifacts.'
        default: false
        required: false
        type: boolean
      runsOn:
        description: 'Defines the type of machine to run the job on.'
        default: ubuntu-latest
        required: false
        type: string
      sonarProjectKey:
        description: 'The project key of the sonar project'
        default: ''
        required: false
        type: string
      sonarOrganization:
        description: 'The name of the sonar organization'
        default: ''
        required: false
        type: string
      versioningProjectName:
        description: 'The name of the project for which the version should be determined. This is only necessary if there are multiple projects in the repository and therefore multiple gitversion.json files are present.'
        default: ''
        required: false
        type: string
      basVersionMajor:
        description: 'The major version number for the build.'
        default: ''
        required: false
        type: string
      basVersionMinor:
        description: 'The minor version number for the build.'
        default: ''
        required: false
        type: string
      basVersionBuild:
        description: 'The build version number for the build.'
        default: ''
        required: false
        type: string
      basVersionRevision:
        description: 'The revision version number for the build.'
        default: ''
        required: false
        type: string
jobs:
  build:

    runs-on: ${{ inputs.runsOn }}

    steps:
    - name: Print Input Parameters
      run: |
        echo basBuildType = ${{ inputs.basBuildType }}
        echo projectOrSolution = ${{ inputs.projectOrSolution }}
        echo artifactsPath = ${{ inputs.artifactsPath }}
        echo dotNetVersion = ${{ inputs.dotNetVersion }}
        echo publishTargetFramework = ${{ inputs.publishTargetFramework }}
        echo runDotnetTest = ${{ inputs.runDotnetTest }}
        echo runDotnetPublish = ${{ inputs.runDotnetPublish }}
        echo runDotnetPack = ${{ inputs.runDotnetPack }}
        echo runsOn = ${{ inputs.runsOn }}
        echo sonarProjectKey = ${{ inputs.sonarProjectKey }}
        echo sonarOrganization = ${{ inputs.sonarOrganization }}
        echo versioningProjectName = ${{ inputs.versioningProjectName }}
        echo basVersionMajor = ${{ inputs.basVersionMajor }}
        echo basVersionMinor = ${{ inputs.basVersionMinor }}
        echo basVersionBuild = ${{ inputs.basVersionBuild }}
        echo basVersionRevision = ${{ inputs.basVersionRevision }}
    - name: Validate Input Parameters
      if: inputs.basBuildType != 'Alpha' && inputs.basBuildType != 'CI' && inputs.basBuildType != 'Preview' && inputs.basBuildType != 'RC' && inputs.basBuildType != 'Release'
      run: |
        echo 'Please check the basBuildType input. Supported values are ''Alpha'', ''CI'', ''Preview'', ''RC'' and ''Release''.'
        exit 1
    
    - name: Set up JDK for Sonar # necessary for Sonar
      uses: actions/setup-java@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        java-version: 21
        distribution: 'zulu' # Alternative distribution options are available.
    
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Shallow clones should be disabled for versioning and a better relevancy of sonar analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotNetVersion }}
        dotnet-quality: 'ga'
    
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    
    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner
    
    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      run: |
        mkdir -p .sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner
    
    - name: Dotnet Restore
      run: dotnet restore ${{ inputs.projectOrSolution }}
    
    - name: Start Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          PR_PARAMS="/d:sonar.pullrequest.key=${{ github.event.pull_request.number }} /d:sonar.pullrequest.branch=${{ github.head_ref }} /d:sonar.pullrequest.base=${{ github.base_ref }} /d:sonar.github.repository=${{ github.repository }} /d:sonar.github.oauth=${{ secrets.GITHUB_TOKEN }}"
        else
          PR_PARAMS=""
        fi
        
        .sonar/scanner/dotnet-sonarscanner begin /k:"${{ inputs.sonarProjectKey }}" /o:"${{ inputs.sonarOrganization }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/*opencover.xml" $PR_PARAMS
    
    - name: Dotnet Build
      run: dotnet build ${{ inputs.projectOrSolution }} -c Release --no-restore -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
        
    - name: Dotnet Test
      if: inputs.runDotnetTest
      run: |
        TARGET=$(ls ${{ inputs.projectOrSolution }} 2>/dev/null | head -n 1)
        if [[ "$TARGET" == *.sln || "$TARGET" == *.slnx ]]; then
          dotnet test --solution "$TARGET" -c Release --no-build --verbosity normal --coverage -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
        elif [[ "$TARGET" == *.csproj ]]; then
          dotnet test --project "$TARGET" -c Release --no-build --verbosity normal --coverage -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
        else
          dotnet test "$TARGET" -c Release --no-build --verbosity normal --coverage -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
        fi
    
    - name: End Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
    
    - name: Dotnet Publish
      if: inputs.runDotnetPublish
      run: dotnet publish ${{ inputs.projectOrSolution }} -c Release --no-build ${{ inputs.publishTargetFramework != '' && format('-f {0}', inputs.publishTargetFramework) || '' }} -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
    
    - name: Attach Build Artifacts to Workflow Run
      if: inputs.runDotnetPublish
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: ${{ inputs.artifactsPath }}/publish/**
        if-no-files-found: error
        retention-days: 10
    
    - name: Dotnet Pack
      if: inputs.runDotnetPack
      run: dotnet pack ${{ inputs.projectOrSolution }} -c Release -p:BAS_CB_VersionMajor=${{ inputs.basVersionMajor }} -p:BAS_CB_VersionMinor=${{ inputs.basVersionMinor }} -p:BAS_CB_VersionBuild=${{ inputs.basVersionBuild }} -p:BAS_CB_VersionRevision=${{ inputs.basVersionRevision }} -p:BAS_CB_BuildType=${{ inputs.basBuildType }}
    
    - name: Attach NuGet Artifacts to Workflow Run
      if: inputs.runDotnetPack
      uses: actions/upload-artifact@v7
      with:
        name: NuGet Packages
        path: ${{ inputs.artifactsPath }}/package/**/*.nupkg
        if-no-files-found: error
        retention-days: 10
    
    - name: Versioning
      id: versioning
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $label = '${{ inputs.basBuildType }}'

        # Prefer version data produced during build (gitversion.json), fallback to workflow inputs.
        $gitVersionFile = Get-ChildItem -Path '${{ inputs.artifactsPath }}/obj/${{ inputs.versioningProjectName }}' -Recurse -Filter 'gitversion.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($null -ne $gitVersionFile) {
          Write-Host "Using gitversion.json from $($gitVersionFile.FullName)"
          $gitVersionJson = Get-Content -Raw $gitVersionFile.FullName | ConvertFrom-Json

          $majorMinorPatch = [string]$gitVersionJson.MajorMinorPatch
          if ([string]::IsNullOrWhiteSpace($majorMinorPatch)) {
            throw 'gitversion.json was found but does not contain MajorMinorPatch.'
          }

          $incrementString = $gitVersionJson.CommitsSinceVersionSource

        } else {
          Write-Host 'No gitversion.json found. Falling back to basVersion* inputs.'

          $major = '${{ inputs.basVersionMajor }}'
          $minor = '${{ inputs.basVersionMinor }}'
          $patch = '${{ inputs.basVersionBuild }}'
          $incrementString = '${{ inputs.basVersionRevision }}'

          if ([string]::IsNullOrWhiteSpace($major) -or [string]::IsNullOrWhiteSpace($minor) -or [string]::IsNullOrWhiteSpace($patch)) {
            throw 'No gitversion.json found and fallback values basVersionMajor/basVersionMinor/basVersionBuild are incomplete.'
          }

          $majorMinorPatch = "$major.$minor.$patch"
        }

        if ($label -eq 'Release') {
          $version = "$majorMinorPatch"
        } else {
          if ([string]::IsNullOrWhiteSpace($incrementString) -or -not ($incrementString -match '^\d+$')) {
            throw 'The version increment is missing or not numeric.'
          }
          $increment = [int]$incrementString
              
          $padded = '{0:D5}' -f $increment
          $version = "$majorMinorPatch-$label$padded"
        }

        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    
    - name: Create Git Tag
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/v${{ steps.versioning.outputs.version }}',
            sha: context.sha
          })
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      if: inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview'
      with:
        files: src/**/*.nupkg
        fail_on_unmatched_files: false
        tag_name: v${{ steps.versioning.outputs.version }}
        prerelease: ${{ inputs.basBuildType != 'Release' }}
    
    - name: Dotnet NuGet Push NuGet.org
      if: inputs.runDotnetPack && (inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview')
      run: dotnet nuget push src/**/*.nupkg --source https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
      
    - name: Dotnet NuGet Push GitHub
      if: inputs.runDotnetPack
      run: dotnet nuget push src/**/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -k ${{ secrets.GITHUB_TOKEN }}
