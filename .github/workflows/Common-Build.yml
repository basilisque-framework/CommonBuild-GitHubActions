name: NetCommonBuild

permissions:
  contents: read
  packages: read

on:
  workflow_call:
    inputs:
      basBuildType:
        description: 'The type of build that should be started. Supported values are ''Alpha'', ''CI'', ''Preview'', ''RC'' and ''Release''.'
        default: 'Preview'
        required: true
        type: string
      projectOrSolution:
        description: 'The project or solution that will be built. The default selects a single .slnx file under src.'
        default: 'src/*.slnx'
        required: false
        type: string
      artifactsPath:
        description: 'The path where build artifacts will be stored. The default is "src/artifacts".'
        default: 'src/artifacts'
        required: false
        type: string
      dotNetVersion:
        description: 'The version of .Net that will be used for the build.'
        default: 11.0.x
        required: false
        type: string
      publishTargetFramework:
        description: 'The target framework that will be used for publishing.'
        default: ''
        required: false
        type: string
      runDotnetTest:
        description: 'If true, runs dotnet test.'
        default: true
        required: false
        type: boolean
      runDotnetPublish:
        description: 'If true, runs dotnet publish and uploads publish artifacts.'
        default: false
        required: false
        type: boolean
      runDotnetPack:
        description: 'If true, runs dotnet pack and uploads/publishes NuGet artifacts.'
        default: false
        required: false
        type: boolean
      verificationScript:
        description: 'Optional repository-relative PowerShell script run after build/publish/pack and before tagging or releasing packages. A failure fails the build.'
        default: ''
        required: false
        type: string
      runsOn:
        description: 'Defines the type of machine to run the job on.'
        default: ubuntu-latest
        required: false
        type: string
      sonarProjectKey:
        description: 'The project key of the sonar project'
        default: ''
        required: false
        type: string
      sonarOrganization:
        description: 'The name of the sonar organization'
        default: ''
        required: false
        type: string
      versioningProjectName:
        description: 'The name of the project for which the version should be determined. This is only necessary if there are multiple projects in the repository and therefore multiple gitversion.json files are present.'
        default: ''
        required: false
        type: string
      versioningPackageId:
        description: 'Package ID that supplies the release version when packing projects with different versions.'
        default: ''
        type: string
      releaseVersion:
        description: 'Expected release version, or explicit version when neither a package nor GitVersion is available.'
        default: ''
        type: string
    outputs:
      sha:
        description: 'Commit compiled by the build job.'
        value: ${{ jobs.build.outputs.sha }}
      releaseVersion:
        description: 'Version selected for a Preview, RC or stable release.'
        value: ${{ jobs.release_plan.outputs.version }}
      nugetArtifactName:
        description: 'Artifact containing the NuGet packages, when requested.'
        value: ${{ inputs.runDotnetPack && format('NuGet Packages-{0}', jobs.build.outputs.id) || '' }}
      publishArtifactName:
        description: 'Artifact containing published binaries, when requested.'
        value: ${{ inputs.runDotnetPublish && format('Artifacts-{0}', jobs.build.outputs.id) || '' }}

env:
  BAS_CB_BuildType: ${{ inputs.basBuildType }}
  ARTIFACTS_PATH: ${{ inputs.artifactsPath }}
  PROJECT_OR_SOLUTION: ${{ inputs.projectOrSolution }}
  GitVersion_NoFetchEnabled: 'true'

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runsOn }}
    outputs:
      id: ${{ steps.plan.outputs.id }}
      sha: ${{ steps.plan.outputs.sha }}
      sdk: ${{ steps.plan.outputs.sdk }}
      target: ${{ steps.plan.outputs.target }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
    - name: Print Input Parameters
      shell: pwsh
      env:
        WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
      run: Write-Host $env:WORKFLOW_INPUTS

    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Shallow clones should be disabled for versioning and a better relevancy of sonar analysis
        persist-credentials: false

    - name: Validate release ref
      if: inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview'
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -cnotmatch '^refs/heads/(main|master|release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            throw "Preview, RC and Release are only allowed on main or release/<major>.<minor>. Ref: $env:GITHUB_REF"
        }
        if ($env:BAS_CB_BuildType -eq 'Release') {
            $stableTags = @(git tag --points-at HEAD | Where-Object { $_ -cmatch '^[vV]?\d+\.\d+\.\d+$' })
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the checkout tags.' }
            if ($stableTags.Count -gt 0) {
                throw "This commit already has a stable tag ($($stableTags -join ', ')). Reuse the existing artifacts to retry publication."
            }
        }

    - &setup_dotnet
      name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotNetVersion }}
        dotnet-quality: 'ga'

    - name: Plan build
      id: plan
      shell: pwsh
      env:
        RUN_TEST: ${{ inputs.runDotnetTest }}
        RUN_PACK: ${{ inputs.runDotnetPack }}
        RUN_PUBLISH: ${{ inputs.runDotnetPublish }}
        SONAR_ENABLED: ${{ inputs.sonarProjectKey != '' && inputs.sonarOrganization != '' }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        if ($env:BAS_CB_BuildType -notin 'alpha', 'ci', 'preview', 'rc', 'release') {
            throw 'basBuildType must be alpha, ci, preview, rc or release.'
        }

        $workspace = $env:GITHUB_WORKSPACE
        $targets = @(
            if (Test-Path -LiteralPath $env:PROJECT_OR_SOLUTION -PathType Leaf) {
                Get-Item -LiteralPath $env:PROJECT_OR_SOLUTION
            }
            else {
                Get-ChildItem -Path $env:PROJECT_OR_SOLUTION -File
            }
        )
        if ($targets.Count -ne 1) { throw 'projectOrSolution must select exactly one solution or project.' }
        $target = [IO.Path]::GetRelativePath($workspace, $targets[0].FullName).Replace('\', '/')
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $workspace)
        $relativeRoot = [IO.Path]::GetRelativePath($workspace, $artifactRoot).Replace('\', '/')
        if ($target -match '(^|/)\.\.?(/|$)|[\r\n]' -or [IO.Path]::IsPathRooted($target) -or
            [IO.Path]::IsPathRooted($env:ARTIFACTS_PATH) -or $relativeRoot -match '(^|/)(\.{1,2}|\.git)(/|$)|[\r\n]' -or [IO.Path]::IsPathRooted($relativeRoot)) {
            throw 'The build target and artifactsPath must be inside the checkout. Use a dedicated artifacts directory.'
        }

        $tasks = @(
            if ($env:RUN_TEST -eq 'true' -and $env:SONAR_ENABLED -ne 'true') { 'test' }
            if ($env:RUN_PACK -eq 'true') { 'pack' }
            if ($env:RUN_PUBLISH -eq 'true') { 'publish' }
        )
        $id = [Guid]::NewGuid().ToString('N').Substring(0, 12)
        $sha = git rev-parse HEAD
        $sdk = dotnet --version
        "id=$id" >> $env:GITHUB_OUTPUT
        "sha=$sha" >> $env:GITHUB_OUTPUT
        "sdk=$sdk" >> $env:GITHUB_OUTPUT
        "target=$target" >> $env:GITHUB_OUTPUT
        "tasks=$(ConvertTo-Json -InputObject $tasks -Compress)" >> $env:GITHUB_OUTPUT
        "Commit: $sha" >> $env:GITHUB_STEP_SUMMARY
        "SDK: $sdk" >> $env:GITHUB_STEP_SUMMARY

    - name: Set up JDK for Sonar # necessary for Sonar
      uses: actions/setup-java@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        java-version: 21
        distribution: 'zulu' # Alternative distribution options are available.

    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: .sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      shell: pwsh
      run: |
        dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner
        exit $LASTEXITCODE

    - name: Dotnet Restore and lock dependencies
      shell: pwsh
      env:
        BUILD_TARGET: ${{ steps.plan.outputs.target }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        dotnet restore $env:BUILD_TARGET --use-lock-file -p:Configuration=Release -p:UseArtifactsOutput=true "-p:ArtifactsPath=$artifactRoot"
        # Generate missing locks while enforcing any locks committed by the caller.
        git diff --exit-code -- ':(glob)**/packages.lock.json' ':(glob)**/packages.*.lock.json'

    - name: Warm up GitVersion serially
      if: runner.os == 'Linux'
      shell: pwsh
      env:
        BUILD_TARGET: ${{ steps.plan.outputs.target }}
        VERSIONING_PROJECT_NAME: ${{ inputs.versioningProjectName }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $projects = @($env:BUILD_TARGET)
        if ([IO.Path]::GetExtension($env:BUILD_TARGET) -in '.sln', '.slnx') {
            $solutionDirectory = Split-Path -Parent (Join-Path $env:GITHUB_WORKSPACE $env:BUILD_TARGET)
            $projects = @(dotnet sln $env:BUILD_TARGET list | ForEach-Object { $_.Trim() } |
                Where-Object { $_ -match '\.(cs|fs|vb)proj$' } |
                ForEach-Object { Join-Path $solutionDirectory $_ })
        }
        if ($env:VERSIONING_PROJECT_NAME) {
            $projects = @($projects | Where-Object { [IO.Path]::GetFileNameWithoutExtension($_) -ceq $env:VERSIONING_PROJECT_NAME })
            if ($projects.Count -ne 1) { throw 'versioningProjectName must select exactly one project.' }
        }

        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        $properties = @('-p:Configuration=Release', '-p:UseArtifactsOutput=true', "-p:ArtifactsPath=$artifactRoot")
        foreach ($project in $projects) {
            $result = dotnet msbuild $project @properties -nologo -v:q '-getProperty:TargetFramework,TargetFrameworks,DisableGitVersionTask,GitVersion_ToolArgments'
            $settings = ($result | ConvertFrom-Json).Properties
            if ($settings.DisableGitVersionTask -ne 'false' -or !$settings.GitVersion_ToolArgments) { continue }
            $framework = $settings.TargetFramework
            if (!$framework) { $framework = ($settings.TargetFrameworks -split ';')[0] }
            if (!$framework) { throw "GitVersion project '$project' did not specify a target framework." }
            dotnet msbuild $project @properties -target:GetVersion "-property:TargetFramework=$framework" -maxcpucount:1 -nodeReuse:false
            return
        }
        Write-Host 'No selected project has GitVersion enabled.'

    - name: Start Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      shell: pwsh
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_KEY: ${{ inputs.sonarProjectKey }}
        SONAR_ORGANIZATION: ${{ inputs.sonarOrganization }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
      run: |
        $scannerArgs = @('begin', "/k:$env:SONAR_KEY", "/o:$env:SONAR_ORGANIZATION", "/d:sonar.token=$env:SONAR_TOKEN", '/d:sonar.host.url=https://sonarcloud.io', '/d:sonar.cs.opencover.reportsPaths=**/TestResults/**/*opencover.xml')
        if ($env:PR_NUMBER) {
            $scannerArgs += "/d:sonar.pullrequest.key=$env:PR_NUMBER", "/d:sonar.pullrequest.branch=$env:PR_HEAD", "/d:sonar.pullrequest.base=$env:PR_BASE"
        }
        & ./.sonar/scanner/dotnet-sonarscanner @scannerArgs
        exit $LASTEXITCODE

    - name: Dotnet Build
      shell: pwsh
      env:
        BUILD_TARGET: ${{ steps.plan.outputs.target }}
      run: |
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        dotnet build $env:BUILD_TARGET -c Release --no-restore -p:UseArtifactsOutput=true "-p:ArtifactsPath=$artifactRoot"
        exit $LASTEXITCODE

    - name: Dotnet Test for Sonar coverage
      if: inputs.runDotnetTest && inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      shell: pwsh
      env:
        BUILD_TARGET: ${{ steps.plan.outputs.target }}
      run: |
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        $selector = if ([IO.Path]::GetExtension($env:BUILD_TARGET) -in '.sln', '.slnx') { '--solution' } else { '--project' }
        dotnet test $selector $env:BUILD_TARGET -c Release --no-build --verbosity normal --coverage -p:UseArtifactsOutput=true "-p:ArtifactsPath=$artifactRoot"
        exit $LASTEXITCODE

    - name: End Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      shell: pwsh
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        & ./.sonar/scanner/dotnet-sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"
        exit $LASTEXITCODE

    - name: Archive build state
      id: state
      if: steps.plan.outputs.tasks != '[]' || inputs.verificationScript != '' || inputs.basBuildType == 'Preview' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Release'
      shell: pwsh
      env:
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ steps.plan.outputs.id }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        New-Item -ItemType Directory -Path $env:TRANSFER_PATH -Force | Out-Null
        git for-each-ref '--format=%(refname) %(objectname) %(symref)' refs/heads refs/remotes refs/tags |
            Where-Object { ($_ -split ' ', 3)[2] -eq '' } |
            Set-Content -LiteralPath (Join-Path $env:TRANSFER_PATH 'refs.txt')
        $PSNativeCommandUseErrorActionPreference = $false
        $head = git symbolic-ref --quiet HEAD
        if ($LASTEXITCODE -gt 1) { throw 'Could not read the checkout branch.' }
        $PSNativeCommandUseErrorActionPreference = $true
        [string]$head | Set-Content -LiteralPath (Join-Path $env:TRANSFER_PATH 'head.txt')

        $workspace = $env:GITHUB_WORKSPACE
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $workspace)
        $entries = @(
            foreach ($name in 'bin', 'obj') {
                $directory = Join-Path $artifactRoot $name
                if (Test-Path -LiteralPath $directory -PathType Container) {
                    [IO.Path]::GetRelativePath($workspace, $directory).Replace('\', '/')
                }
            }
            Get-ChildItem -LiteralPath $workspace -Recurse -File -Include 'packages.lock.json','packages.*.lock.json' |
                Where-Object { !$_.FullName.StartsWith($artifactRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::Ordinal) } |
                ForEach-Object { [IO.Path]::GetRelativePath($workspace, $_.FullName).Replace('\', '/') }
        )
        if (!$entries) { throw 'The build produced no files to transfer.' }
        if ($entries -match '[\r\n]') { throw 'Build artifact paths must fit on one line.' }
        $fileList = Join-Path $env:TRANSFER_PATH 'archive-files.txt'
        $entries | ForEach-Object { "./$_" } | Set-Content -LiteralPath $fileList
        tar -cf (Join-Path $env:TRANSFER_PATH 'build.tar') -T $fileList

    - name: Upload build state
      if: steps.state.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: Build state-${{ steps.plan.outputs.id }}
        path: |
          ${{ runner.temp }}/commonbuild-${{ steps.plan.outputs.id }}/build.tar
          ${{ runner.temp }}/commonbuild-${{ steps.plan.outputs.id }}/refs.txt
          ${{ runner.temp }}/commonbuild-${{ steps.plan.outputs.id }}/head.txt
        if-no-files-found: error
        compression-level: 1
        retention-days: 10

  post_build:
    name: ${{ matrix.task }}
    needs: build
    if: needs.build.outputs.tasks != '[]'
    runs-on: ${{ inputs.runsOn }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.build.outputs.tasks || '[]') }}
    steps:
    - &checkout_built_commit
      name: Checkout built commit
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.build.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - *setup_dotnet

    - &download_build_state
      name: Download build state
      uses: actions/download-artifact@v8
      with:
        name: Build state-${{ needs.build.outputs.id }}
        path: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}

    - &unpack_build_state
      name: Unpack build state
      shell: pwsh
      env:
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        tar -xf (Join-Path $env:TRANSFER_PATH 'build.tar')

    - &restore_build_environment
      name: Reuse Git context and locked dependencies
      shell: pwsh
      env:
        BUILT_SHA: ${{ needs.build.outputs.sha }}
        BUILD_SDK: ${{ needs.build.outputs.sdk }}
        BUILD_TARGET: ${{ needs.build.outputs.target }}
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $sdk = dotnet --version
        if ($sdk -cne $env:BUILD_SDK) {
            throw "The Build job used SDK '$env:BUILD_SDK'. This runner selected '$sdk'. Pin the SDK for all jobs."
        }

        # Pin the branches and tags that GitVersion could see during compilation.
        $snapshot = [Collections.Generic.Dictionary[string,string]]::new([StringComparer]::Ordinal)
        foreach ($line in Get-Content -LiteralPath (Join-Path $env:TRANSFER_PATH 'refs.txt')) {
            $refName, $objectId = $line -split ' ', 2
            $snapshot.Add($refName, $objectId.Trim())
        }
        $transaction = @(
            'start'
            git for-each-ref '--format=%(refname) %(symref)' refs/heads refs/remotes refs/tags | ForEach-Object {
                $refName, $symbolicRef = $_ -split ' ', 2
                if (!$symbolicRef -and !$snapshot.ContainsKey($refName)) { "delete $refName" }
            }
            foreach ($refName in $snapshot.Keys) { "update $refName $($snapshot[$refName])" }
            'prepare'
            'commit'
        )
        # Git's stdin protocol requires LF, including on Windows.
        $git = [Diagnostics.ProcessStartInfo]::new('git', 'update-ref --stdin')
        $git.WorkingDirectory = $env:GITHUB_WORKSPACE
        $git.RedirectStandardInput = $true
        $git.StandardInputEncoding = [Text.UTF8Encoding]::new($false)
        $git.UseShellExecute = $false
        $process = [Diagnostics.Process]::Start($git)
        try {
            $process.StandardInput.NewLine = [string][char]10
            foreach ($command in $transaction) { $process.StandardInput.WriteLine($command) }
            $process.StandardInput.Close()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw 'Could not restore the Git refs from Build.' }
        }
        finally { $process.Dispose() }
        $head = ([string](Get-Content -LiteralPath (Join-Path $env:TRANSFER_PATH 'head.txt') -Raw)).Trim()
        if ($head) { git symbolic-ref HEAD $head }
        $sha = git rev-parse HEAD
        if ($sha -cne $env:BUILT_SHA) { throw "Expected checkout '$env:BUILT_SHA', got '$sha'." }

        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        dotnet restore $env:BUILD_TARGET --locked-mode --force -p:Configuration=Release -p:UseArtifactsOutput=true "-p:ArtifactsPath=$artifactRoot"

    - name: Run ${{ matrix.task }}
      shell: pwsh
      env:
        BUILD_TARGET: ${{ needs.build.outputs.target }}
        TASK: ${{ matrix.task }}
        PUBLISH_FRAMEWORK: ${{ inputs.publishTargetFramework }}
      run: |
        $artifactRoot = [IO.Path]::GetFullPath($env:ARTIFACTS_PATH, $env:GITHUB_WORKSPACE)
        $commonArgs = @('-c', 'Release', '--no-build', '-p:UseArtifactsOutput=true', "-p:ArtifactsPath=$artifactRoot")
        switch ($env:TASK) {
            'test' {
                $selector = if ([IO.Path]::GetExtension($env:BUILD_TARGET) -in '.sln', '.slnx') { '--solution' } else { '--project' }
                dotnet test $selector $env:BUILD_TARGET @commonArgs --verbosity normal --coverage
            }
            'pack' { dotnet pack $env:BUILD_TARGET @commonArgs }
            'publish' {
                $frameworkArgs = @()
                if ($env:PUBLISH_FRAMEWORK) { $frameworkArgs = @('-f', $env:PUBLISH_FRAMEWORK) }
                dotnet publish $env:BUILD_TARGET @commonArgs @frameworkArgs
            }
            default { throw "Unknown build task '$env:TASK'." }
        }
        exit $LASTEXITCODE

    - name: Attach NuGet Artifacts to Workflow Run
      if: matrix.task == 'pack'
      uses: actions/upload-artifact@v7
      with:
        name: NuGet Packages-${{ needs.build.outputs.id }}
        path: ${{ inputs.artifactsPath }}/package/**/*.nupkg
        if-no-files-found: error
        overwrite: true
        retention-days: 10

    - name: Archive published binaries
      if: matrix.task == 'publish'
      shell: pwsh
      env:
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        tar -cf (Join-Path $env:TRANSFER_PATH 'publish.tar') -- (Join-Path $env:ARTIFACTS_PATH 'publish')

    - name: Attach published binaries to Workflow Run
      if: matrix.task == 'publish'
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts-${{ needs.build.outputs.id }}
        path: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}/publish.tar
        if-no-files-found: error
        overwrite: true
        retention-days: 10

  verify:
    name: Repository verification
    needs: [build, post_build]
    if: |
      !cancelled() && inputs.verificationScript != '' && needs.build.result == 'success' &&
      (needs.post_build.result == 'success' || needs.post_build.result == 'skipped')
    runs-on: ${{ inputs.runsOn }}
    steps:
    - *checkout_built_commit
    - *setup_dotnet
    - *download_build_state
    - *unpack_build_state
    - *restore_build_environment

    - &download_nuget
      name: Download NuGet packages
      if: inputs.runDotnetPack
      uses: actions/download-artifact@v8
      with:
        name: NuGet Packages-${{ needs.build.outputs.id }}
        path: ${{ inputs.artifactsPath }}/package

    - name: Download published binaries
      if: inputs.runDotnetPublish
      uses: actions/download-artifact@v8
      with:
        name: Artifacts-${{ needs.build.outputs.id }}
        path: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}

    - name: Unpack published binaries
      if: inputs.runDotnetPublish
      shell: pwsh
      env:
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}
      run: |
        tar -xf (Join-Path $env:TRANSFER_PATH 'publish.tar')
        exit $LASTEXITCODE

    - name: Run Repository Verification
      if: inputs.verificationScript != ''
      shell: pwsh
      env:
        VERIFICATION_SCRIPT: ${{ inputs.verificationScript }}
        BAS_CB_BUILD_TYPE: ${{ inputs.basBuildType }}
        BAS_CB_ARTIFACTS_PATH: ${{ inputs.artifactsPath }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $global:LASTEXITCODE = 0
        & (Join-Path $env:GITHUB_WORKSPACE $env:VERIFICATION_SCRIPT)
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release_plan:
    name: Resolve version and tag release
    needs: [build, post_build, verify]
    if: |
      !cancelled() && (inputs.basBuildType == 'Preview' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Release') &&
      needs.build.result == 'success' &&
      (needs.post_build.result == 'success' || needs.post_build.result == 'skipped') &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ inputs.runsOn }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
    - *download_nuget

    - name: Download build state for a release without NuGet packages
      if: '!inputs.runDotnetPack'
      uses: actions/download-artifact@v8
      with:
        name: Build state-${{ needs.build.outputs.id }}
        path: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}

    - name: Read build outputs
      if: '!inputs.runDotnetPack'
      shell: pwsh
      env:
        TRANSFER_PATH: ${{ runner.temp }}/commonbuild-${{ needs.build.outputs.id }}
      run: |
        tar -xf (Join-Path $env:TRANSFER_PATH 'build.tar')
        exit $LASTEXITCODE

    - name: Versioning
      id: versioning
      shell: pwsh
      env:
        ARTIFACTS_PATH: ${{ inputs.artifactsPath }}
        VERSIONING_PROJECT_NAME: ${{ inputs.versioningProjectName }}
        VERSIONING_PACKAGE_ID: ${{ inputs.versioningPackageId }}
        BUILT_SHA: ${{ needs.build.outputs.sha }}
        RELEASE_VERSION: ${{ inputs.releaseVersion }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sha = $env:BUILT_SHA
        if (!$sha) {
            $sha = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not determine the checked-out commit.' }
        }
        "sha=$sha" >> $env:GITHUB_OUTPUT
        "Commit: $sha" >> $env:GITHUB_STEP_SUMMARY

        $channel = $env:BAS_CB_BuildType.ToLowerInvariant()


        $versions = @(
            Get-ChildItem -LiteralPath (Join-Path $env:ARTIFACTS_PATH 'package') -Recurse -Filter '*.nupkg' -File -ErrorAction SilentlyContinue |
            ForEach-Object {
                $package = [IO.Compression.ZipFile]::OpenRead($_.FullName)
                try {
                    $manifest = $package.Entries | Where-Object Name -like '*.nuspec'
                    $reader = [IO.StreamReader]::new($manifest.Open())
                    try {
                        $metadata = ([xml]$reader.ReadToEnd()).package.metadata
                        if (!$env:VERSIONING_PACKAGE_ID -or $metadata.id -eq $env:VERSIONING_PACKAGE_ID) {
                            $metadata.version
                        }
                    }
                    finally { $reader.Dispose() }
                }
                finally { $package.Dispose() }
            } | Sort-Object -Unique
        )
        if ($versions.Count -eq 0 -and $env:VERSIONING_PACKAGE_ID) {
            throw "No built package matched versioningPackageId '$env:VERSIONING_PACKAGE_ID'."
        }
        if ($versions.Count -eq 0) {
            $objPath = Join-Path $env:ARTIFACTS_PATH 'obj'
            if ($env:VERSIONING_PROJECT_NAME) { $objPath = Join-Path $objPath $env:VERSIONING_PROJECT_NAME }
            $versions = @(
                Get-ChildItem -LiteralPath $objPath -Recurse -Filter 'gitversion.json' -File -ErrorAction SilentlyContinue |
                ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json).SemVer } |
                Where-Object { $_ } | Sort-Object -Unique
            )
        }
        if ($channel -in 'alpha', 'ci') {
            if ($versions.Count -gt 0) { "Version(s): $($versions -join ', ')" >> $env:GITHUB_STEP_SUMMARY }
            return
        }
        if ($versions.Count -eq 0 -and $env:RELEASE_VERSION) { $versions = @($env:RELEASE_VERSION) }
        if ($versions.Count -ne 1) {
            throw 'A release needs exactly one artifact version. Select versioningPackageId for differently versioned packages or versioningProjectName for a build without packages.'
        }
        $version = $versions[0]
        if ($env:RELEASE_VERSION -and $env:RELEASE_VERSION -cne $version) {
            throw "Built version '$version' does not match releaseVersion '$env:RELEASE_VERSION'."
        }

        $core = '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
        if ($channel -eq 'release') {
            if ($version -cnotmatch "^$core$") { throw "Release requires a stable version. Built: $version" }
            if ($env:GITHUB_REF -cmatch '^refs/heads/release/(?<line>\d+\.\d+)$' -and !$version.StartsWith("$($Matches.line).", [StringComparison]::Ordinal)) {
                throw "Version '$version' does not belong to release line '$($Matches.line)'."
            }
        }
        elseif ($version -cnotmatch "^$core-$channel(\.[0-9A-Za-z-]+)+$") {
            throw "Build type '$channel' requires a matching prerelease version. Built: $version"
        }

        "version=$version" >> $env:GITHUB_OUTPUT
        "Version: $version" >> $env:GITHUB_STEP_SUMMARY

    - name: Create Git Tag
      if: steps.versioning.outputs.version != ''
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/v${{ steps.versioning.outputs.version }}',
            sha: '${{ steps.versioning.outputs.sha }}'
          })

  push_nuget:
    name: Push to ${{ matrix.feed }}
    needs: [build, post_build, verify, release_plan]
    if: |
      !cancelled() && inputs.runDotnetPack && needs.build.result == 'success' &&
      needs.post_build.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.release_plan.result == 'success' ||
       (needs.release_plan.result == 'skipped' && (inputs.basBuildType == 'Alpha' || inputs.basBuildType == 'CI')))
    runs-on: ${{ inputs.runsOn }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        feed: ${{ fromJSON((inputs.basBuildType == 'Alpha' || inputs.basBuildType == 'CI') && '["GitHub Packages"]' || '["GitHub Packages","NuGet.org"]') }}
    steps:
    - *setup_dotnet
    - *download_nuget

    - name: Push verified packages
      shell: pwsh
      env:
        FEED: ${{ matrix.feed }}
        GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ matrix.feed == 'GitHub Packages' && secrets.GITHUB_TOKEN || '' }}
        NUGET_API_KEY: ${{ matrix.feed == 'NuGet.org' && secrets.NUGET_API_KEY || '' }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $destination = if ($env:FEED -eq 'NuGet.org') { 'https://api.nuget.org/v3/index.json' } else { $env:GITHUB_PACKAGES_SOURCE }
        $token = if ($env:FEED -eq 'NuGet.org') { $env:NUGET_API_KEY } else { $env:GITHUB_TOKEN }
        $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:ARTIFACTS_PATH 'package') -Recurse -Filter '*.nupkg' -File)
        if ($packages.Count -eq 0) { throw 'No verified NuGet packages to push.' }
        foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $token --source $destination
        }

  github_release:
    name: Create GitHub Release
    needs: [build, release_plan, push_nuget]
    if: |
      !cancelled() && needs.release_plan.result == 'success' &&
      (needs.push_nuget.result == 'success' || (!inputs.runDotnetPack && needs.push_nuget.result == 'skipped'))
    runs-on: ${{ inputs.runsOn }}
    permissions:
      contents: write
    steps:
    - *download_nuget

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ inputs.artifactsPath }}/package/**/*.nupkg
        fail_on_unmatched_files: false
        tag_name: v${{ needs.release_plan.outputs.version }}
        prerelease: ${{ inputs.basBuildType != 'Release' }}
