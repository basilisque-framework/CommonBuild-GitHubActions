name: NetCommonBuild

permissions:
  contents: write
  packages: write
  #id-token: write  # enable GitHub OIDC token issuance for this job

on:
  workflow_call:
    inputs:
      basBuildType:
        description: 'The type of build that should be started. Supported values are ''Alpha'', ''CI'', ''Preview'', ''RC'' and ''Release''.'
        default: 'Preview'
        required: true
        type: string
      projectOrSolution:
        description: 'The project or solution that will be built. The default builds all solutions in the "src" directory of the repository.'
        default: 'src/*.slnx'
        required: false
        type: string
      artifactsPath:
        description: 'The path where build artifacts will be stored. The default is "src/artifacts".'
        default: 'src/artifacts'
        required: false
        type: string
      dotNetVersion:
        description: 'The version of .Net that will be used for the build.'
        default: 11.0.x
        required: false
        type: string
      publishTargetFramework:
        description: 'The target framework that will be used for publishing.'
        default: ''
        required: false
        type: string
      runDotnetTest:
        description: 'If true, runs dotnet test.'
        default: true
        required: false
        type: boolean
      runDotnetPublish:
        description: 'If true, runs dotnet publish and uploads publish artifacts.'
        default: false
        required: false
        type: boolean
      runDotnetPack:
        description: 'If true, runs dotnet pack and uploads/publishes NuGet artifacts.'
        default: false
        required: false
        type: boolean
      verificationScript:
        description: 'Optional repository-relative PowerShell script run after build/publish/pack and before tagging or releasing packages. A failure fails the build.'
        default: ''
        required: false
        type: string
      runsOn:
        description: 'Defines the type of machine to run the job on.'
        default: ubuntu-latest
        required: false
        type: string
      sonarProjectKey:
        description: 'The project key of the sonar project'
        default: ''
        required: false
        type: string
      sonarOrganization:
        description: 'The name of the sonar organization'
        default: ''
        required: false
        type: string
      versioningProjectName:
        description: 'The name of the project for which the version should be determined. This is only necessary if there are multiple projects in the repository and therefore multiple gitversion.json files are present.'
        default: ''
        required: false
        type: string
      versioningPackageId:
        description: 'Package ID that supplies the release version when packing projects with different versions.'
        default: ''
        type: string
      releaseVersion:
        description: 'Expected release version, or explicit version when neither a package nor GitVersion is available.'
        default: ''
        type: string
jobs:
  build:

    runs-on: ${{ inputs.runsOn }}
    env:
      BAS_CB_BuildType: ${{ inputs.basBuildType }}
      NUGET_PACKAGE_GLOB: ${{ inputs.artifactsPath }}/package/**/*.nupkg

    steps:
    - name: Print Input Parameters
      env:
        DOTNET_VERSION: ${{ inputs.dotNetVersion }}
      run: |
        echo basBuildType = ${{ inputs.basBuildType }}
        echo projectOrSolution = ${{ inputs.projectOrSolution }}
        echo artifactsPath = ${{ inputs.artifactsPath }}
        echo "dotNetVersion = $DOTNET_VERSION"
        echo publishTargetFramework = ${{ inputs.publishTargetFramework }}
        echo runDotnetTest = ${{ inputs.runDotnetTest }}
        echo runDotnetPublish = ${{ inputs.runDotnetPublish }}
        echo runDotnetPack = ${{ inputs.runDotnetPack }}
        echo runsOn = ${{ inputs.runsOn }}
        echo sonarProjectKey = ${{ inputs.sonarProjectKey }}
        echo sonarOrganization = ${{ inputs.sonarOrganization }}
        echo versioningProjectName = ${{ inputs.versioningProjectName }}
    - name: Validate Input Parameters
      if: inputs.basBuildType != 'Alpha' && inputs.basBuildType != 'CI' && inputs.basBuildType != 'Preview' && inputs.basBuildType != 'RC' && inputs.basBuildType != 'Release'
      run: |
        echo 'Please check the basBuildType input. Supported values are ''Alpha'', ''CI'', ''Preview'', ''RC'' and ''Release''.'
        exit 1

    - name: Set up JDK for Sonar # necessary for Sonar
      uses: actions/setup-java@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        java-version: 21
        distribution: 'zulu' # Alternative distribution options are available.

    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Shallow clones should be disabled for versioning and a better relevancy of sonar analysis

    - name: Validate release ref
      if: inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview'
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -cnotmatch '^refs/heads/(main|master|release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            throw "Preview, RC and Release are only allowed on main or release/<major>.<minor>. Ref: $env:GITHUB_REF"
        }
        if ($env:BAS_CB_BuildType -eq 'Release') {
            $stableTags = @(git tag --points-at HEAD | Where-Object { $_ -cmatch '^[vV]?\d+\.\d+\.\d+$' })
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the checkout tags.' }
            if ($stableTags.Count -gt 0) {
                throw "This commit already has a stable tag ($($stableTags -join ', ')). Reuse the existing artifacts to retry publication."
            }
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotNetVersion }}
        dotnet-quality: 'ga'

    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@v5
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      run: |
        mkdir -p .sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

    - name: Dotnet Restore
      run: dotnet restore ${{ inputs.projectOrSolution }}

    - name: Warm up GitVersion serially
      if: runner.os == 'Linux'
      env:
        PROJECT_OR_SOLUTION: ${{ inputs.projectOrSolution }}
        VERSIONING_PROJECT_NAME: ${{ inputs.versioningProjectName }}
      run: |
        set -euo pipefail

        if [[ -f "$PROJECT_OR_SOLUTION" ]]; then
          target="$PROJECT_OR_SOLUTION"
        else
          if ! matches="$(compgen -G "$PROJECT_OR_SOLUTION" | sort)"; then
            echo "No project or solution matches '$PROJECT_OR_SOLUTION'." >&2
            exit 1
          fi
          mapfile -t targets <<< "$matches"
          target="${targets[0]}"
        fi

        if [[ "$target" == *.csproj ]]; then
          project="$target"
        else
          if ! listing="$(dotnet sln "$target" list)"; then
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          projects=()
          while IFS= read -r candidate; do
            candidate="${candidate%$'\r'}"
            candidate="${candidate//\\//}"
            if [[ "$candidate" == *.csproj ]]; then
              projects+=("$candidate")
            fi
          done <<< "$listing"

          if [[ -n "$VERSIONING_PROJECT_NAME" ]]; then
            if ((${#projects[@]})); then
              for candidate in "${projects[@]}"; do
                if [[ "$(basename "$candidate" .csproj)" == "$VERSIONING_PROJECT_NAME" ]]; then
                  project="$candidate"
                  break
                fi
              done
            fi
            if [[ -z "${project:-}" ]]; then
              echo "Could not find versioning project '$VERSIONING_PROJECT_NAME' in '$PROJECT_OR_SOLUTION'." >&2
              exit 1
            fi
          else
            project="${projects[0]:-}"
          fi

          # dotnet sln list returns paths relative to the solution, not the working directory.
          if [[ -n "${project:-}" && "$project" != /* ]]; then
            project="$(dirname "$target")/$project"
          fi
        fi

        if [[ -z "${project:-}" ]]; then
          echo "Could not find a C# project in '$PROJECT_OR_SOLUTION' to warm up GitVersion." >&2
          exit 1
        fi

        echo "Reading target frameworks from '$project'."
        if ! properties="$(dotnet msbuild "$project" -property:Configuration=Release -getProperty:TargetFramework,TargetFrameworks,DisableGitVersionTask,GitVersion_ToolArgments)"; then
          printf '%s\n' "$properties" >&2
          exit 1
        fi
        if [[ "$(jq -r '.Properties.DisableGitVersionTask // ""' <<< "$properties")" != false || -z "$(jq -r '.Properties.GitVersion_ToolArgments // ""' <<< "$properties")" ]]; then
          echo "GitVersion is not active for '$project'."
          exit 0
        fi

        target_framework="$(jq -r '(.Properties.TargetFramework // "") as $framework | if $framework != "" then $framework else (.Properties.TargetFrameworks // "") end' <<< "$properties")"
        target_framework="${target_framework%%;*}"

        if [[ -z "$target_framework" ]]; then
          echo "Could not determine a target framework for '$project'." >&2
          exit 1
        fi

        echo "Warming up GitVersion with '$project' for '$target_framework'."
        dotnet msbuild "$project" \
          -target:GetVersion \
          -property:TargetFramework="$target_framework" \
          -property:Configuration=Release \
          -maxcpucount:1 \
          -nodeReuse:false

    - name: Start Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          PR_PARAMS="/d:sonar.pullrequest.key=${{ github.event.pull_request.number }} /d:sonar.pullrequest.branch=${{ github.head_ref }} /d:sonar.pullrequest.base=${{ github.base_ref }} /d:sonar.github.repository=${{ github.repository }} /d:sonar.github.oauth=${{ secrets.GITHUB_TOKEN }}"
        else
          PR_PARAMS=""
        fi

        .sonar/scanner/dotnet-sonarscanner begin /k:"${{ inputs.sonarProjectKey }}" /o:"${{ inputs.sonarOrganization }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/*opencover.xml" $PR_PARAMS

    - name: Dotnet Build
      run: dotnet build ${{ inputs.projectOrSolution }} -c Release --no-restore

    - name: Dotnet Test
      if: inputs.runDotnetTest
      run: |
        TARGET=$(ls ${{ inputs.projectOrSolution }} 2>/dev/null | head -n 1)
        if [[ "$TARGET" == *.sln || "$TARGET" == *.slnx ]]; then
          dotnet test --solution "$TARGET" -c Release --no-build --verbosity normal --coverage
        elif [[ "$TARGET" == *.csproj ]]; then
          dotnet test --project "$TARGET" -c Release --no-build --verbosity normal --coverage
        else
          dotnet test "$TARGET" -c Release --no-build --verbosity normal --coverage
        fi

    - name: End Sonar Analysis
      if: inputs.sonarProjectKey != '' && inputs.sonarOrganization != ''
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Dotnet Publish
      if: inputs.runDotnetPublish
      run: dotnet publish ${{ inputs.projectOrSolution }} -c Release --no-build ${{ inputs.publishTargetFramework != '' && format('-f {0}', inputs.publishTargetFramework) || '' }}

    - name: Attach Build Artifacts to Workflow Run
      if: inputs.runDotnetPublish
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: ${{ inputs.artifactsPath }}/publish/**
        if-no-files-found: error
        retention-days: 10

    - name: Dotnet Pack
      if: inputs.runDotnetPack
      run: dotnet pack ${{ inputs.projectOrSolution }} -c Release --no-build

    - name: Run Repository Verification
      if: inputs.verificationScript != ''
      shell: pwsh
      env:
        VERIFICATION_SCRIPT: ${{ inputs.verificationScript }}
        BAS_CB_BUILD_TYPE: ${{ inputs.basBuildType }}
        BAS_CB_ARTIFACTS_PATH: ${{ inputs.artifactsPath }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $global:LASTEXITCODE = 0
        & (Join-Path $env:GITHUB_WORKSPACE $env:VERIFICATION_SCRIPT)
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Attach NuGet Artifacts to Workflow Run
      if: inputs.runDotnetPack
      uses: actions/upload-artifact@v7
      with:
        name: NuGet Packages
        path: ${{ env.NUGET_PACKAGE_GLOB }}
        if-no-files-found: error
        retention-days: 10

    - name: Versioning
      id: versioning
      shell: pwsh
      env:
        ARTIFACTS_PATH: ${{ inputs.artifactsPath }}
        VERSIONING_PROJECT_NAME: ${{ inputs.versioningProjectName }}
        VERSIONING_PACKAGE_ID: ${{ inputs.versioningPackageId }}
        RELEASE_VERSION: ${{ inputs.releaseVersion }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sha = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { throw 'Could not determine the checked-out commit.' }
        "sha=$sha" >> $env:GITHUB_OUTPUT
        "Commit: $sha" >> $env:GITHUB_STEP_SUMMARY

        $channel = $env:BAS_CB_BuildType.ToLowerInvariant()


        $versions = @(
            Get-ChildItem -LiteralPath (Join-Path $env:ARTIFACTS_PATH 'package') -Recurse -Filter '*.nupkg' -File -ErrorAction SilentlyContinue |
            ForEach-Object {
                $package = [IO.Compression.ZipFile]::OpenRead($_.FullName)
                try {
                    $manifest = $package.Entries | Where-Object Name -like '*.nuspec'
                    $reader = [IO.StreamReader]::new($manifest.Open())
                    try {
                        $metadata = ([xml]$reader.ReadToEnd()).package.metadata
                        if (!$env:VERSIONING_PACKAGE_ID -or $metadata.id -eq $env:VERSIONING_PACKAGE_ID) {
                            $metadata.version
                        }
                    }
                    finally { $reader.Dispose() }
                }
                finally { $package.Dispose() }
            } | Sort-Object -Unique
        )
        if ($versions.Count -eq 0 -and $env:VERSIONING_PACKAGE_ID) {
            throw "No built package matched versioningPackageId '$env:VERSIONING_PACKAGE_ID'."
        }
        if ($versions.Count -eq 0) {
            $objPath = Join-Path $env:ARTIFACTS_PATH 'obj'
            if ($env:VERSIONING_PROJECT_NAME) { $objPath = Join-Path $objPath $env:VERSIONING_PROJECT_NAME }
            $versions = @(
                Get-ChildItem -LiteralPath $objPath -Recurse -Filter 'gitversion.json' -File -ErrorAction SilentlyContinue |
                ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json).SemVer } |
                Where-Object { $_ } | Sort-Object -Unique
            )
        }
        if ($channel -in 'alpha', 'ci') {
            if ($versions.Count -gt 0) { "Version(s): $($versions -join ', ')" >> $env:GITHUB_STEP_SUMMARY }
            return
        }
        if ($versions.Count -eq 0 -and $env:RELEASE_VERSION) { $versions = @($env:RELEASE_VERSION) }
        if ($versions.Count -ne 1) {
            throw 'A release needs exactly one artifact version. Select versioningPackageId for differently versioned packages or versioningProjectName for a build without packages.'
        }
        $version = $versions[0]
        if ($env:RELEASE_VERSION -and $env:RELEASE_VERSION -cne $version) {
            throw "Built version '$version' does not match releaseVersion '$env:RELEASE_VERSION'."
        }

        $core = '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
        if ($channel -eq 'release') {
            if ($version -cnotmatch "^$core$") { throw "Release requires a stable version. Built: $version" }
            if ($env:GITHUB_REF -cmatch '^refs/heads/release/(?<line>\d+\.\d+)$' -and !$version.StartsWith("$($Matches.line).", [StringComparison]::Ordinal)) {
                throw "Version '$version' does not belong to release line '$($Matches.line)'."
            }
        }
        elseif ($version -cnotmatch "^$core-$channel(\.[0-9A-Za-z-]+)+$") {
            throw "Build type '$channel' requires a matching prerelease version. Built: $version"
        }

        "version=$version" >> $env:GITHUB_OUTPUT
        "Version: $version" >> $env:GITHUB_STEP_SUMMARY

    - name: Create Git Tag
      if: steps.versioning.outputs.version != ''
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/v${{ steps.versioning.outputs.version }}',
            sha: '${{ steps.versioning.outputs.sha }}'
          })

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      if: inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview'
      with:
        files: ${{ env.NUGET_PACKAGE_GLOB }}
        fail_on_unmatched_files: false
        tag_name: v${{ steps.versioning.outputs.version }}
        prerelease: ${{ inputs.basBuildType != 'Release' }}

    # - name: NuGet login (OIDC → temp API key) # Get a short-lived NuGet API key
    #   if: inputs.runDotnetPack && (inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview')
    #   uses: NuGet/login@v1
    #   id: nugetlogin
    #   with:
    #     user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), NOT your email address

    - name: Dotnet NuGet Push NuGet.org
      if: inputs.runDotnetPack && (inputs.basBuildType == 'Release' || inputs.basBuildType == 'RC' || inputs.basBuildType == 'Preview')
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      # For OIDC, set NUGET_API_KEY from steps.nugetlogin.outputs.NUGET_API_KEY.
      run: dotnet nuget push "$env:NUGET_PACKAGE_GLOB" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

    - name: Dotnet NuGet Push GitHub
      if: inputs.runDotnetPack
      shell: pwsh
      env:
        GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push "$env:NUGET_PACKAGE_GLOB" --source "$env:GITHUB_PACKAGES_SOURCE" --api-key "$env:GITHUB_TOKEN"